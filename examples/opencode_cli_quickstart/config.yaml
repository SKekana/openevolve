# Reuses examples/function_minimization/{initial_program,evaluator}.py.
# Configure providers and authenticate with `opencode auth login` first.
max_iterations: 10
checkpoint_interval: 5

llm:
  provider: opencode_cli
  retries: 2
  retry_delay: 5
  models:
    - name: modal/sihlek55--ep-glm-5-3-server.us-west.modal.direct
      weight: 0.3
      timeout: 600
    - name: modal/sihlek55--ep-glm-5-3-flash-server.us-west.modal.direct
      weight: 0.7
      timeout: 300

prompt:
  system_message: >
    You are an expert programmer specializing in optimization algorithms.
    Improve the search_algorithm function to find the global minimum reliably,
    escaping local minima. The objective is
    f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20.
    Return the requested code changes for OpenEvolve to apply and evaluate.

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7

evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 1
  use_llm_feedback: false

diff_based_evolution: true
max_code_length: 20000
